
  server:
    port: 8080
    servlet:
      context-path: /travelbot

  spring:
    profiles:
      active: secret

    datasource:
      url: jdbc:mysql://localhost:3306/ai_tour_guide
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: none
      show-sql: false
      open-in-view: false

  logging:
    level:
      com.tourism: INFO

